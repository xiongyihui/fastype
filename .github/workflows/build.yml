name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Release 步骤需要写权限创建 GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
        shell: bash

      - name: Build
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -H windowsgui" -o dist/fastype.exe ./cmd/fastype
          go build -ldflags "-X main.debugDefault=1" -o dist/fastype-debug.exe ./cmd/fastype
        shell: bash

      - name: Package zip
        run: Compress-Archive -Path dist/fastype.exe, dist/fastype-debug.exe -DestinationPath dist/fastype-windows-amd64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastype-windows-amd64
          path: dist/fastype-windows-amd64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fastype-windows-amd64.zip

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Package app + DMG
        run: scripts/package-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastype-macos
          path: |
            dist/*.dmg
            dist/fastype-macos-universal

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
